<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Al-Quds - App Islámica</title>
    <style>
        /* ===== ESTILOS GLOBALES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0a1f0a; color: #e8d5b5; padding: 15px; padding-bottom: 20px; min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; position: relative; }
        
        /* ===== IMAGEN DE PORTADA AÑADIDA ===== */
        .portada-img {
            display: block;
            max-width: 45%; /* Controla el tamaño de la mezquita */
            height: auto;
            margin: 0 auto 15px auto; /* Centrado y espacio inferior */
            border-radius: 25px; /* Bordes redondeados como icono */
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.25); /* Brillo dorado suave */
            background-color: #0a1f0a; /* Evita bordes blancos alrededor de la imagen */
        }

        h1 { text-align: center; color: #d4af37; font-size: 2rem; letter-spacing: 2px; text-shadow: 0 0 10px #d4af3740; }
        .subh1 { text-align: center; font-size: 0.9rem; color: #b8956a; margin-bottom: 15px; }

        /* Selector de idioma con banderas circulares */
        .lang-selector {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 100;
            display: flex;
            gap: 6px;
            background: rgba(10, 31, 10, 0.8);
            padding: 4px 8px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid #2a4a2a;
        }
        .lang-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: transparent;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            color: #fff;
            font-weight: bold;
        }
        .lang-btn:hover {
            transform: scale(1.1);
            border-color: #b8956a;
        }
        .lang-btn.active {
            border-color: #d4af37;
            box-shadow: 0 0 12px #d4af3740;
            background: #1a2f1a;
        }
        .lang-btn .flag-emoji {
            line-height: 1;
        }
        .lang-btn .arabic-char {
            background: #1a6b3a;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            font-weight: bold;
        }

        .tabs { display: flex; gap: 5px; margin: 20px 0; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 12px 0; background: #142814; border: 1px solid #d4af37; color: #b8956a; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .tab-btn.active { background: #d4af37; color: #0a1f0a; border-color: #d4af37; }
        .tab-content { display: none; animation: fade 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fade { from { opacity: 0.3; } to { opacity: 1; } }

        .city-input { display: flex; gap: 10px; margin-bottom: 20px; }
        .city-input input { flex: 1; padding: 12px; border-radius: 30px; border: 1px solid #d4af37; background: #1a2f1a; color: #fff; font-size: 1rem; text-align: center; }
        .city-input button { padding: 12px 25px; border-radius: 30px; border: none; background: #d4af37; color: #0a1f0a; font-weight: bold; cursor: pointer; }

        .prayer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .prayer-card { background: #142814; padding: 12px 5px; border-radius: 15px; text-align: center; border-bottom: 3px solid #d4af37; }
        .prayer-card .name { font-size: 0.8rem; color: #b8956a; text-transform: uppercase; }
        .prayer-card .time { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .prayer-card.active { border-bottom-color: #00ff88; background: #1e3a1e; box-shadow: 0 0 20px #00ff8833; }

        .countdown-box { background: #142814; padding: 15px; border-radius: 50px; text-align: center; margin: 15px 0; border: 1px solid #d4af37; }
        .countdown-box span { font-size: 2.2rem; font-weight: bold; color: #d4af37; letter-spacing: 3px; }

        /* ===== CORÁN ===== */
        .quran-text-area { background: #142814; padding: 15px; border-radius: 20px; margin: 15px 0; }
        .quran-text-area .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .quran-text-area select { flex: 2; padding: 12px; border-radius: 30px; background: #1a2f1a; color: #fff; border: 1px solid #d4af37; font-size: 1rem; }
        .quran-text-area .verse { display: flex; gap: 15px; margin: 8px 0; padding: 8px; border-bottom: 1px solid #2a4a2a; align-items: flex-start; }
        .quran-text-area .arabic { font-size: 1.4rem; color: #d4af37; width: 50%; text-align: right; line-height: 1.8; }
        .quran-text-area .translation { font-size: 0.95rem; color: #c5b08a; width: 50%; line-height: 1.6; }
        .quran-text-area .verse-number { 
            display: inline-block; 
            min-width: 24px; 
            height: 24px; 
            background: #d4af37; 
            color: #0a1f0a; 
            border-radius: 50%; 
            text-align: center; 
            font-size: 0.75rem; 
            font-weight: bold; 
            line-height: 24px; 
            margin-right: 8px; 
            flex-shrink: 0;
        }
        .quran-text-area .surah-name { color: #d4af37; font-size: 1.2rem; text-align: center; margin: 10px 0; }

        /* ===== DUA ===== */
        .dua-container { background: #142814; padding: 15px; border-radius: 20px; margin: 15px 0; }
        .dua-item { 
            background: #1a2f1a; 
            padding: 15px; 
            border-radius: 15px; 
            margin-bottom: 15px; 
            border-left: 4px solid #d4af37;
        }
        .dua-item .dua-title { color: #d4af37; font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
        .dua-item .dua-arabic { font-size: 1.6rem; color: #fff; text-align: right; line-height: 2; margin-bottom: 8px; }
        .dua-item .dua-translation { color: #c5b08a; font-size: 1rem; line-height: 1.6; }

        /* ===== REPRODUCTOR FIJO ===== */
        .audio-player-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #0f1f0f;
            border-top: 2px solid #d4af37;
            padding: 12px 20px;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            gap: 6px;
        }
        .audio-player-fixed.visible { display: flex; }
        .audio-player-fixed .controls-row {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .audio-player-fixed button {
            background: transparent;
            border: none;
            color: #d4af37;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 4px 10px;
            transition: 0.2s;
        }
        .audio-player-fixed button:hover { color: #fff; }
        .audio-player-fixed input[type="range"] {
            flex: 1;
            min-width: 150px;
            accent-color: #d4af37;
            background: #2a4a2a;
            height: 6px;
            border-radius: 3px;
            cursor: pointer;
        }
        .audio-player-fixed .time-label {
            color: #b8956a;
            font-size: 0.9rem;
            min-width: 110px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .audio-player-fixed .surah-info {
            color: #b8956a;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 2px;
        }
        .footer { text-align: center; font-size: 0.7rem; color: #5a7a5a; margin-top: 30px; }

        @media (max-width: 480px) { 
            .prayer-grid { grid-template-columns: repeat(3, 1fr); } 
            .prayer-card .time { font-size: 1.2rem; }
            .quran-text-area .verse { flex-direction: column; gap: 5px; }
            .quran-text-area .arabic { width: 100%; text-align: right; }
            .quran-text-area .translation { width: 100%; }
            .audio-player-fixed .controls-row { gap: 8px; }
            .audio-player-fixed button { font-size: 1.4rem; }
            .lang-selector { position: relative; justify-content: center; margin-bottom: 10px; gap: 4px; }
            .lang-btn { width: 30px; height: 30px; font-size: 16px; }
            
            /* Ajuste de imagen en pantallas pequeñas */
            .portada-img { max-width: 60%; }
        }
    </style>
</head>

        <button class="tab-btn" data-tab="tab3" data-i18n="tab_dua">Dua</button>
    </div>

    <!-- TAB 1: REZOS -->
    <div id="tab1" class="tab-content active">
        <div class="city-input">

        </div>
        <div class="countdown-box" data-i18n="next_prayer">Próximo rezo: <span id="countdownTimer">--:--:--</span></div>
        <div class="prayer-grid" id="prayerTimesContainer">
            <div class="prayer-card"><div class="name" data-i18n="prayer_fajr">Fajr</div><div class="time" id="Fajr">--:--</div></div>
            <div class="prayer-card"><div class="name" data-i18n="prayer_dhuhr">Dhuhr</div><div class="time" id="Dhuhr">--:--</div></div>
            <div class="prayer-card"><div class="name" data-i18n="prayer_asr">Asr</div><div class="time" id="Asr">--:--</div></div>
            <div class="prayer-card"><div class="name" data-i18n="prayer_maghrib">Maghrib</div><div class="time" id="Maghrib">--:--</div></div>
            <div class="prayer-card"><div class="name" data-i18n="prayer_isha">Isha</div><div class="time" id="Isha">--:--</div></div>
            <div class="prayer-card"><div class="name" data-i18n="prayer_qibla">Qibla</div><div class="time" style="font-size:1rem;">Makkah</div></div>
        </div>
    </div>

    <!-- TAB 2: CORÁN -->
    <div id="tab2" class="tab-content">
        <div class="quran-text-area">
            <h3 style="color:#d4af37; text-align:center; margin-bottom:10px;" data-i18n="quran_title">El Sagrado Corán</h3>
            <div class="controls">
                <select id="surahSelect">
                    <option value="" data-i18n="select_surah">Selecciona una Sura</option>
                </select>
            </div>
            <div id="audioStatus" style="text-align:center; color:#b8956a; margin:5px 0;"></div>
            <div id="quranDisplay">
                <p style="text-align:center; color:#b8956a;" data-i18n="quran_placeholder">Elige una sura para leer.</p>
            </div>
        </div>
    </div>

    <!-- TAB 3: DUA -->
    <div id="tab3" class="tab-content">
        <div class="dua-container">
            <h3 style="color:#d4af37; text-align:center; margin-bottom:15px;" data-i18n="dua_title">Súplicas (Duas)</h3>
            <div id="duaList"></div>
        </div>
    </div>

    <div class="footer" data-i18n="footer">Al-Quds · Horarios aproximados · Adhan automático</div>
</div>

<!-- REPRODUCTOR FIJO -->
<div class="audio-player-fixed" id="audioPlayerFixed">
    <div class="surah-info" id="surahInfo" data-i18n="select_surah_audio">Selecciona una sura para escuchar</div>
    <div class="controls-row">
        <button id="prevSurahBtn">&#8249;&#8249;</button>
        <button id="playBtn">&#9654;</button>
        <button id="nextSurahBtn">&#8250;&#8250;</button>
        <input type="range" id="progressSlider" value="0" min="0" max="100" step="0.1">
        <span class="time-label" id="timeDisplay">00:00 / 00:00</span>

</div>

    // ================================================================
    const prayerIds = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
    let prayerTimes = {};
    let userLat = 40.4165, userLng = -3.7026;
    let currentCity = 'Madrid';
    let adhanAudio = new Audio('https://www.islamcan.com/audio/adhan/azan-makkah.mp3');
    adhanAudio.preload = 'auto';
    let currentSurah = '';
    let currentLang = 'es'; // idioma global

    let audio = new Audio();
    let isPlaying = false;

    // ===== LISTA DE DUAS (estática) =====
    const duas = [
        { title: { es: 'Dua al despertar', fr: 'Dua au réveil', en: 'Dua upon waking', ar: 'دعاء الاستيقاظ' },
          arabic: 'اَلْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ' },
        { title: { es: 'Dua al dormir', fr: 'Dua avant de dormir', en: 'Dua before sleeping', ar: 'دعاء النوم' },
          arabic: 'بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا' },
        { title: { es: 'Dua al salir de casa', fr: 'Dua en quittant la maison', en: 'Dua leaving home', ar: 'دعاء الخروج من المنزل' },
          arabic: 'بِسْمِ اللهِ، تَوَكَّلْتُ عَلَى اللهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ' },
        { title: { es: 'Dua al entrar a casa', fr: 'Dua en entrant à la maison', en: 'Dua entering home', ar: 'دعاء دخول المنزل' },
          arabic: 'بِسْمِ اللهِ وَلَجْنَا، وَبِسْمِ اللهِ خَرَجْنَا، وَعَلَى رَبِّنَا تَوَكَّلْنَا' },
        { title: { es: 'Dua antes de comer', fr: 'Dua avant de manger', en: 'Dua before eating', ar: 'دعاء قبل الأكل' },
          arabic: 'بِسْمِ اللهِ وَعَلَى بَرَكَةِ اللهِ' },
        { title: { es: 'Dua después de comer', fr: 'Dua après avoir mangé', en: 'Dua after eating', ar: 'دعاء بعد الأكل' },
          arabic: 'اَلْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ' },
        { title: { es: 'Dua al entrar al baño', fr: 'Dua en entrant aux toilettes', en: 'Dua entering bathroom', ar: 'دعاء دخول الخلاء' },
          arabic: 'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ' },
        { title: { es: 'Dua al salir del baño', fr: 'Dua en sortant des toilettes', en: 'Dua leaving bathroom', ar: 'دعاء الخروج من الخلاء' },
          arabic: 'غُفْرَانَكَ' }
    ];

    // ================================================================
    // FUNCIONES DE INTERNACIONALIZACIÓN
    // ================================================================
    function getTranslation(key) {
        return i18n[currentLang]?.[key] || i18n['es'][key] || key;
    }

    function getDuaTranslation(index) {
        return duaTranslations[currentLang]?.[index] || duaTranslations['es'][index] || duas[index].arabic;
    }

    function getDuaTitle(index) {
        return duas[index].title[currentLang] || duas[index].title['es'] || 'Dua';
    }

    // ================================================================
    // ACTUALIZAR IDIOMA DE LA INTERFAZ
    // ================================================================
    function updateUILanguage() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.dataset.i18n;
            let text = getTranslation(key);
            if (el.id === 'countdownBox' || el.classList.contains('countdown-box')) {
                const span = el.querySelector('span');
                if (span) {
                    el.childNodes.forEach(node => {
                        if (node.nodeType === 3) node.textContent = text;
                    });
                } else {
                    el.textContent = text;
                }
            } else {
                el.textContent = text;
            }
        });

        document.getElementById('cityInput').placeholder = getTranslation('city_placeholder');
        const surahSelect = document.getElementById('surahSelect');
        const defaultOption = surahSelect.querySelector('option[value=""]');
        if (defaultOption) {
            defaultOption.textContent = getTranslation('select_surah');
        }
    }

    // ================================================================
    // SELECCIÓN DE IDIOMA CON BANDERAS
    // ================================================================
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentLang = this.dataset.lang;
            updateUILanguage();
            loadDuas();
            if (currentSurah) {
                loadQuran(currentSurah);
            } else {
                const display = document.getElementById('quranDisplay');
                display.innerHTML = `<p style="text-align:center;color:#b8956a;">${getTranslation('quran_placeholder')}</p>`;
                document.getElementById('surahInfo').textContent = getTranslation('select_surah_audio');
            }
        });
    });

    // ================================================================
    // PESTAÑAS
    // ================================================================
    const player = document.getElementById('audioPlayerFixed');

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            const tabId = this.dataset.tab;
            document.getElementById(tabId).classList.add('active');

            if (tabId === 'tab2') {
                player.classList.add('visible');
            } else {
                player.classList.remove('visible');
                if (isPlaying) audio.pause();
            }
        });
    });

    // ================================================================
    // UBICACIÓN Y HORARIOS
    // ================================================================
    function getUserLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    reverseGeocode(userLat, userLng);
                },
                () => {
                    document.getElementById('fechaLocation').innerHTML = `📍 ${currentCity} ${getTranslation('gps_denied')} · ${new Date().toLocaleDateString('es-ES')}`;
                    fetchPrayerTimes(userLat, userLng);
                }
            );
        } else {
            document.getElementById('fechaLocation').innerHTML = `📍 ${currentCity} ${getTranslation('no_gps')} · ${new Date().toLocaleDateString('es-ES')}`;
            fetchPrayerTimes(userLat, userLng);
        }
    }

    function reverseGeocode(lat, lng) {
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`)
            .then(r => r.json())
            .then(data => {
                const addr = data.address || {};
                const city = addr.city || addr.town || addr.village || addr.county || 'tu ciudad';
                currentCity = city;
                document.getElementById('cityInput').value = city;
                document.getElementById('fechaLocation').innerHTML = `📍 ${city} · ${new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}`;
                fetchPrayerTimes(lat, lng);
            })
            .catch(() => {
                document.getElementById('fechaLocation').innerHTML = `📍 Coordenadas actuales · ${new Date().toLocaleDateString('es-ES')}`;
                fetchPrayerTimes(lat, lng);
            });
    }

    function fetchPrayerTimes(lat, lng) {
        const today = Math.floor(Date.now() / 1000);
        const url = `https://api.aladhan.com/v1/timings/${today}?latitude=${lat}&longitude=${lng}&method=8`;
        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.code === 200) {
                    const timings = data.data.timings;
                    prayerTimes = {
                        Fajr: timings.Fajr,
                        Dhuhr: timings.Dhuhr,
                        Asr: timings.Asr,
                        Maghrib: timings.Maghrib,
                        Isha: timings.Isha
                    };
                    prayerIds.forEach(id => document.getElementById(id).innerText = prayerTimes[id]);
                    startCountdownAndAdhan();
                    highlightCurrentPrayer();
                }
            })
            .catch(err => console.error('Error horarios:', err));
    }

    function startCountdownAndAdhan() {
        setInterval(() => {
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];

            let prayerDates = prayerIds.map(id => {
                const [h, m] = prayerTimes[id].split(':').map(Number);
                return { id, time: new Date(`${todayStr}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`) };
            });
            prayerDates.sort((a, b) => a.time - b.time);

            let next = null;
            for (let p of prayerDates) {
                if (p.time > now) {
                    next = p;
                    break;
                }
            }
            if (!next && prayerDates.length > 0) {
                const first = prayerDates[0];
                const tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                const [h, m] = prayerTimes[first.id].split(':').map(Number);
                tomorrow.setHours(h, m, 0, 0);
                next = { id: first.id, time: tomorrow };
            }

            if (next) {
                let diff = (next.time - now) / 1000;
                if (diff < 0) diff = 0;
                if (diff > 86400) diff = 86400;

                const hrs = Math.floor(diff / 3600);
                const mins = Math.floor((diff % 3600) / 60);
                const secs = Math.floor(diff % 60);
                document.getElementById('countdownTimer').innerText =
                    `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            }

            const currentMin = now.getHours() * 60 + now.getMinutes();
            prayerIds.forEach(id => {
                const [h, m] = prayerTimes[id].split(':').map(Number);
                const prayerMin = h * 60 + m;
                if (Math.abs(currentMin - prayerMin) <= 1) {
                    if (!window._lastAdhan || window._lastAdhan !== id) {
                        window._lastAdhan = id;
                        playAdhan();
                    }
                }
            });

            highlightCurrentPrayer();
        }, 1000);
    }

    function highlightCurrentPrayer() {
        const now = new Date();
        const currentMin = now.getHours() * 60 + now.getMinutes();
        let activeId = null, minDiff = Infinity;
        prayerIds.forEach(id => {
            const [h, m] = prayerTimes[id].split(':').map(Number);
            const diff = currentMin - (h * 60 + m);
            if (diff >= 0 && diff < minDiff) {
                minDiff = diff;
                activeId = id;
            }
            document.getElementById(id).parentElement.classList.remove('active');
        });
        if (activeId) document.getElementById(activeId).parentElement.classList.add('active');
    }

    function playAdhan() {
        try { adhanAudio.currentTime = 0; adhanAudio.play().catch(e => {}); } catch(e) {}
    }

    // ================================================================
    // BÚSQUEDA DE CIUDAD
    // ================================================================
    document.getElementById('searchBtn').addEventListener('click', function() {
        const city = document.getElementById('cityInput').value.trim();
        if (!city) return;
        fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`)
            .then(r => r.json())
            .then(data => {
                if (data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lng = parseFloat(data[0].lon);
                    userLat = lat; userLng = lng;
                    currentCity = data[0].display_name.split(',')[0];
                    document.getElementById('fechaLocation').innerHTML = `📍 ${currentCity} · ${new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}`;
                    fetchPrayerTimes(lat, lng);
                } else alert(getTranslation('city_not_found'));
            })
            .catch(() => alert(getTranslation('search_error')));
    });

    // ================================================================
    // CORÁN – CARGA DE SURAS Y TEXTO
    // ================================================================
    function loadSurahList() {
        const select = document.getElementById('surahSelect');
        fetch('https://api.alquran.cloud/v1/surah')
            .then(r => r.json())
            .then(data => {
                if (data.code === 200) {
                    data.data.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.number;
                        opt.textContent = `${s.number}. ${s.englishName} (${s.name})`;
                        select.appendChild(opt);
                    });
                }
            })
            .catch(err => console.error('Error cargando suras:', err));
    }

    // ================================================================
    // CARGA DE CORÁN (TEXTO + AUDIO) con idioma global
    // ================================================================
    function loadQuran(surahNumber) {
        const display = document.getElementById('quranDisplay');
        if (!surahNumber) {
            display.innerHTML = `<p style="text-align:center;color:#b8956a;">${getTranslation('quran_placeholder')}</p>`;
            document.getElementById('surahInfo').textContent = getTranslation('select_surah_audio');
            document.getElementById('audioStatus').textContent = '';
            return;
        }
        display.innerHTML = `<p style="text-align:center;color:#d4af37;">${getTranslation('loading')}</p>`;

        let edition = '';
        if (currentLang === 'es') edition = 'es.asad';
        else if (currentLang === 'fr') edition = 'fr.hamidullah';
        else if (currentLang === 'en') edition = 'en.sahih';
        else edition = ''; // árabe solo texto

        const arabicUrl = `https://api.alquran.cloud/v1/surah/${surahNumber}`;
        const translationUrl = edition ? `https://api.alquran.cloud/v1/surah/${surahNumber}/${edition}` : null;

        const promises = [fetch(arabicUrl).then(r => r.json())];
        if (translationUrl) promises.push(fetch(translationUrl).then(r => r.json()));

        Promise.all(promises)
            .then(([arabicData, transData]) => {
                if (arabicData.code === 200) {
                    const arabicVerses = arabicData.data.ayahs;
                    let transMap = {};
                    if (transData && transData.code === 200) {
                        transData.data.ayahs.forEach(v => {
                            transMap[v.numberInSurah] = v.text;
                        });
                    }

                    let html = `<div class="surah-name">${arabicData.data.englishName} - ${arabicData.data.name}</div>`;

                    arabicVerses.forEach(v => {
                        const num = v.numberInSurah;
                        const aText = v.text;
                        const tText = transMap[num] || (edition ? getTranslation('translation_not_available') : '');
                        html += `<div class="verse" data-verse="${num}">
                                    <div class="arabic">
                                        <span class="verse-number">${num}</span>
                                        ${aText}
                                    </div>`;
                        if (edition) {
                            html += `<div class="translation">${tText}</div>`;
                        }
                        html += `</div>`;
                    });

                    display.innerHTML = html;
                    document.getElementById('surahInfo').textContent = `${arabicData.data.englishName} (${arabicData.data.name})`;
                    loadAudioForSurah(surahNumber);
                } else {
                    display.innerHTML = `<p style="color:#ff6b6b;">${getTranslation('error_load')}</p>`;
                }
            })
            .catch(err => {
                console.error(err);
                display.innerHTML = `<p style="color:#ff6b6b;">${getTranslation('error_network')}</p>`;
            });
    }

    // ================================================================
    // AUDIO – UN SOLO RECITADOR (ALAFASY)
    // ================================================================
    function loadAudioForSurah(surahNumber) {
        const audioUrl = `https://server8.mp3quran.net/afs/${String(surahNumber).padStart(3, '0')}.mp3`;
        console.log('Cargando audio:', audioUrl);

        if (isPlaying) audio.pause();

        audio.src = audioUrl;
        audio.load();

        const statusDiv = document.getElementById('audioStatus');
        statusDiv.textContent = getTranslation('audio_loading');
        document.getElementById('progressSlider').value = 0;
        document.getElementById('timeDisplay').textContent = '00:00 / 00:00';
        document.getElementById('playBtn').innerHTML = '&#9654;';
        isPlaying = false;

        audio.onloadedmetadata = function() {
            document.getElementById('timeDisplay').textContent = `00:00 / ${formatTime(audio.duration)}`;
            statusDiv.textContent = getTranslation('audio_ready');
        };

        audio.ontimeupdate = function() {
            if (!audio.duration) return;
            const progress = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progressSlider').value = progress;
            document.getElementById('timeDisplay').textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        };

        audio.onplay = function() {
            isPlaying = true;
            document.getElementById('playBtn').innerHTML = '&#9208;';
            statusDiv.textContent = getTranslation('audio_playing');
        };

        audio.onpause = function() {
            isPlaying = false;
            document.getElementById('playBtn').innerHTML = '&#9654;';
            statusDiv.textContent = getTranslation('audio_paused');
        };

        audio.onended = function() {
            isPlaying = false;
            document.getElementById('playBtn').innerHTML = '&#9654;';
            document.getElementById('progressSlider').value = 0;
            document.getElementById('timeDisplay').textContent = `00:00 / ${formatTime(audio.duration)}`;
            statusDiv.textContent = getTranslation('audio_ended');
        };

        audio.onerror = function(e) {
            console.error('Error de audio:', e);
            statusDiv.textContent = getTranslation('audio_error');
            document.getElementById('playBtn').innerHTML = '&#9654;';
            isPlaying = false;
            document.getElementById('surahInfo').textContent = 'Error de audio';
        };
    }

    function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return '00:00';
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    // ================================================================
    // CONTROLES DE AUDIO
    // ================================================================
    document.getElementById('playBtn').addEventListener('click', function() {
        if (!audio.src) {
            alert(getTranslation('select_surah_audio'));
            return;
        }
        if (audio.paused) {
            audio.play().catch(e => {
                console.log('Error al reproducir:', e);
                document.getElementById('audioStatus').textContent = getTranslation('audio_play_error');
            });
        } else {
            audio.pause();
        }
    });

    document.getElementById('progressSlider').addEventListener('input', function() {
        if (audio.duration) {
            const newTime = (this.value / 100) * audio.duration;
            audio.currentTime = newTime;
            document.getElementById('timeDisplay').textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        }
    });

    document.getElementById('prevSurahBtn').addEventListener('click', function() {
        const select = document.getElementById('surahSelect');
        const options = select.options;
        let idx = select.selectedIndex;
        if (idx > 0) {
            select.selectedIndex = idx - 1;
            select.dispatchEvent(new Event('change'));
        }
    });

    document.getElementById('nextSurahBtn').addEventListener('click', function() {
        const select = document.getElementById('surahSelect');
        const options = select.options;
        let idx = select.selectedIndex;
        if (idx < options.length - 1) {
            select.selectedIndex = idx + 1;
            select.dispatchEvent(new Event('change'));
        }
    });

    // ================================================================
    // EVENTOS DE SELECCIÓN (CORÁN)
    // ================================================================
    document.getElementById('surahSelect').addEventListener('change', function() {
        currentSurah = this.value;
        if (isPlaying) audio.pause();
        loadQuran(currentSurah);
    });

    // ================================================================
    // CARGA DE DUAS (con idioma actual)
    // ================================================================
    function loadDuas() {
        const container = document.getElementById('duaList');
        let html = '';
        duas.forEach((dua, index) => {
            const title = getDuaTitle(index);
            const translation = getDuaTranslation(index);
            html += `
                <div class="dua-item">
                    <div class="dua-title">${title}</div>
                    <div class="dua-arabic">${dua.arabic}</div>
                    <div class="dua-translation">${translation}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ================================================================
    // INICIO
    // ================================================================
    window.onload = function() {
        // Idioma por defecto: español (botón activo ya está marcado en HTML)
        currentLang = 'es';
        updateUILanguage();
        loadSurahList();
        getUserLocation();
        loadDuas();
    };
</script>
</body>
</html>
