<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Al-Quds - App Islámica</title>
    <style>
        /* ===== ESTILOS GLOBALES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0a1f0a; color: #e8d5b5; padding: 15px; min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { text-align: center; color: #d4af37; font-size: 2rem; letter-spacing: 2px; text-shadow: 0 0 10px #d4af3740; }
        .subh1 { text-align: center; font-size: 0.9rem; color: #b8956a; margin-bottom: 15px; }
        /* Navegación por pestañas */
        .tabs { display: flex; gap: 5px; margin: 20px 0; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 12px 0; background: #142814; border: 1px solid #d4af37; color: #b8956a; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .tab-btn.active { background: #d4af37; color: #0a1f0a; border-color: #d4af37; }
        .tab-content { display: none; animation: fade 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fade { from { opacity: 0.3; } to { opacity: 1; } }

        /* Buscador ciudad */
        .city-input { display: flex; gap: 10px; margin-bottom: 20px; }
        .city-input input { flex: 1; padding: 12px; border-radius: 30px; border: 1px solid #d4af37; background: #1a2f1a; color: #fff; font-size: 1rem; text-align: center; }
        .city-input button { padding: 12px 25px; border-radius: 30px; border: none; background: #d4af37; color: #0a1f0a; font-weight: bold; cursor: pointer; }

        /* Tarjetas de rezos */
        .prayer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .prayer-card { background: #142814; padding: 12px 5px; border-radius: 15px; text-align: center; border-bottom: 3px solid #d4af37; }
        .prayer-card .name { font-size: 0.8rem; color: #b8956a; text-transform: uppercase; }
        .prayer-card .time { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .prayer-card.active { border-bottom-color: #00ff88; background: #1e3a1e; box-shadow: 0 0 20px #00ff8833; }

        .countdown-box { background: #142814; padding: 15px; border-radius: 50px; text-align: center; margin: 15px 0; border: 1px solid #d4af37; }
        .countdown-box span { font-size: 2.2rem; font-weight: bold; color: #d4af37; letter-spacing: 3px; }

        /* Corán en texto */
        .quran-text-area { background: #142814; padding: 15px; border-radius: 20px; margin: 15px 0; }
        .quran-text-area .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .quran-text-area select { flex: 2; padding: 12px; border-radius: 30px; background: #1a2f1a; color: #fff; border: 1px solid #d4af37; font-size: 1rem; }
        .quran-text-area .lang-select { flex: 1; min-width: 120px; }
        .quran-text-area .verse { display: flex; gap: 15px; margin: 8px 0; padding: 8px; border-bottom: 1px solid #2a4a2a; align-items: flex-start; }
        .quran-text-area .arabic { font-size: 1.4rem; color: #d4af37; width: 50%; text-align: right; line-height: 1.8; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
        .quran-text-area .translation { font-size: 0.95rem; color: #c5b08a; width: 50%; line-height: 1.6; }
        .quran-text-area .verse-number { 
            display: inline-block; 
            min-width: 24px; 
            height: 24px; 
            background: #d4af37; 
            color: #0a1f0a; 
            border-radius: 50%; 
            text-align: center; 
            font-size: 0.75rem; 
            font-weight: bold; 
            line-height: 24px; 
            margin-right: 8px; 
            flex-shrink: 0;
        }
        .quran-text-area .surah-name { color: #d4af37; font-size: 1.2rem; text-align: center; margin: 10px 0; }
        .quran-text-area .basmala { 
            text-align: center; 
            font-size: 1.8rem; 
            color: #d4af37; 
            margin: 10px 0 20px 0; 
            font-weight: bold; 
            text-shadow: 0 0 15px #d4af3740;
            border-bottom: 2px solid #2a4a2a;
            padding-bottom: 12px;
        }

        .footer { text-align: center; font-size: 0.7rem; color: #5a7a5a; margin-top: 30px; }
        @media (max-width: 480px) { 
            .prayer-grid { grid-template-columns: repeat(3, 1fr); } 
            .prayer-card .time { font-size: 1.2rem; }
            .quran-text-area .verse { flex-direction: column; gap: 5px; }
            .quran-text-area .arabic { width: 100%; text-align: right; }
            .quran-text-area .translation { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🕌 Al-Quds</h1>
    <div class="subh1" id="fechaLocation">Cargando ubicación...</div>

    <!-- Navegación -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="tab1">⏰ Rezos</button>
        <button class="tab-btn" data-tab="tab2">📖 Corán</button>
    </div>

    <!-- TAB 1: REZOS -->
    <div id="tab1" class="tab-content active">
        <div class="city-input">
            <input type="text" id="cityInput" placeholder="Ej: Madrid, Barcelona" value="Madrid">
            <button id="searchBtn">Buscar</button>
        </div>
        <div class="countdown-box">⏳ Próximo rezo: <span id="countdownTimer">--:--:--</span></div>
        <div class="prayer-grid" id="prayerTimesContainer">
            <div class="prayer-card"><div class="name">Fajr</div><div class="time" id="Fajr">--:--</div></div>
            <div class="prayer-card"><div class="name">Dhuhr</div><div class="time" id="Dhuhr">--:--</div></div>
            <div class="prayer-card"><div class="name">Asr</div><div class="time" id="Asr">--:--</div></div>
            <div class="prayer-card"><div class="name">Maghrib</div><div class="time" id="Maghrib">--:--</div></div>
            <div class="prayer-card"><div class="name">Isha</div><div class="time" id="Isha">--:--</div></div>
            <div class="prayer-card"><div class="name">🌙 Qibla</div><div class="time" style="font-size:1rem;">Makkah</div></div>
        </div>
    </div>

    <!-- TAB 2: CORÁN ESCRITO CON SELECCIÓN DE IDIOMA -->
    <div id="tab2" class="tab-content">
        <div class="quran-text-area">
            <h3 style="color:#d4af37; text-align:center; margin-bottom:10px;">📖 El Sagrado Corán</h3>
            <div class="controls">
                <select id="surahSelect">
                    <option value="">Selecciona una Sura</option>
                </select>
                <select id="langSelect" class="lang-select">
                    <option value="es.asad">Español</option>
                    <option value="en.sahih">Inglés</option>
                    <option value="fr.hamidullah">Francés</option>
                    <option value="de.bubenheim">Alemán</option>
                </select>
            </div>
            <div id="quranDisplay">
                <p style="text-align:center; color:#b8956a;">Elige una sura y un idioma.</p>
            </div>
        </div>
    </div>

    <div class="footer">Al-Quds · Horarios aproximados · Adhan automático</div>
</div>

<!-- ===== SCRIPTS ===== -->
<script>
    // ============================================================
    // 1. ELEMENTOS Y VARIABLES GLOBALES
    // ============================================================
    const prayerIds = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
    let prayerTimes = {};
    let userLat = 40.4165, userLng = -3.7026;
    let currentCity = 'Madrid';
    let adhanAudio = new Audio('https://www.islamcan.com/audio/adhan/azan-makkah.mp3');
    adhanAudio.preload = 'auto';
    let currentSurah = '';

    // ============================================================
    // 2. PESTAÑAS
    // ============================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(this.dataset.tab).classList.add('active');
        });
    });

    // ============================================================
    // 3. UBICACIÓN Y HORARIOS
    // ============================================================
    function getUserLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    reverseGeocode(userLat, userLng);
                },
                () => {
                    document.getElementById('fechaLocation').innerHTML = `📍 ${currentCity} (GPS denegado) · ${new Date().toLocaleDateString('es-ES')}`;
                    fetchPrayerTimes(userLat, userLng);
                }
            );
        } else {
            document.getElementById('fechaLocation').innerHTML = `📍 ${currentCity} (sin GPS) · ${new Date().toLocaleDateString('es-ES')}`;
            fetchPrayerTimes(userLat, userLng);
        }
    }

    function reverseGeocode(lat, lng) {
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`)
            .then(r => r.json())
            .then(data => {
                const addr = data.address || {};
                const city = addr.city || addr.town || addr.village || addr.county || 'tu ciudad';
                currentCity = city;
                document.getElementById('cityInput').value = city;
                document.getElementById('fechaLocation').innerHTML = `📍 ${city} · ${new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}`;
                fetchPrayerTimes(lat, lng);
            })
            .catch(() => {
                document.getElementById('fechaLocation').innerHTML = `📍 Coordenadas actuales · ${new Date().toLocaleDateString('es-ES')}`;
                fetchPrayerTimes(lat, lng);
            });
    }

    function fetchPrayerTimes(lat, lng) {
        const today = Math.floor(Date.now() / 1000);
        const url = `https://api.aladhan.com/v1/timings/${today}?latitude=${lat}&longitude=${lng}&method=8`;
        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.code === 200) {
                    const timings = data.data.timings;
                    prayerTimes = {
                        Fajr: timings.Fajr,
                        Dhuhr: timings.Dhuhr,
                        Asr: timings.Asr,
                        Maghrib: timings.Maghrib,
                        Isha: timings.Isha
                    };
                    prayerIds.forEach(id => document.getElementById(id).innerText = prayerTimes[id]);
                    startCountdownAndAdhan();
                    highlightCurrentPrayer();
                }
            })
            .catch(err => console.error('Error horarios:', err));
    }

    // ============================================================
    // 4. CONTADOR Y ADHAN
    // ============================================================
    function startCountdownAndAdhan() {
        setInterval(() => {
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];

            let prayerDates = prayerIds.map(id => {
                const [h, m] = prayerTimes[id].split(':').map(Number);
                return { id, time: new Date(`${todayStr}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`) };
            });
            prayerDates.sort((a, b) => a.time - b.time);

            let next = null;
            for (let p of prayerDates) {
                if (p.time > now) {
                    next = p;
                    break;
                }
            }
            if (!next && prayerDates.length > 0) {
                const first = prayerDates[0];
                const tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                const [h, m] = prayerTimes[first.id].split(':').map(Number);
                tomorrow.setHours(h, m, 0, 0);
                next = { id: first.id, time: tomorrow };
            }

            if (next) {
                let diff = (next.time - now) / 1000;
                if (diff < 0) diff = 0;
                if (diff > 86400) diff = 86400;

                const hrs = Math.floor(diff / 3600);
                const mins = Math.floor((diff % 3600) / 60);
                const secs = Math.floor(diff % 60);
                document.getElementById('countdownTimer').innerText =
                    `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            }

            const currentMin = now.getHours() * 60 + now.getMinutes();
            prayerIds.forEach(id => {
                const [h, m] = prayerTimes[id].split(':').map(Number);
                const prayerMin = h * 60 + m;
                if (Math.abs(currentMin - prayerMin) <= 1) {
                    if (!window._lastAdhan || window._lastAdhan !== id) {
                        window._lastAdhan = id;
                        playAdhan();
                    }
                }
            });

            highlightCurrentPrayer();
        }, 1000);
    }

    function highlightCurrentPrayer() {
        const now = new Date();
        const currentMin = now.getHours() * 60 + now.getMinutes();
        let activeId = null, minDiff = Infinity;
        prayerIds.forEach(id => {
            const [h, m] = prayerTimes[id].split(':').map(Number);
            const diff = currentMin - (h * 60 + m);
            if (diff >= 0 && diff < minDiff) {
                minDiff = diff;
                activeId = id;
            }
            document.getElementById(id).parentElement.classList.remove('active');
        });
        if (activeId) document.getElementById(activeId).parentElement.classList.add('active');
    }

    function playAdhan() {
        try { adhanAudio.currentTime = 0; adhanAudio.play().catch(e => {}); } catch(e) {}
    }

    // ============================================================
    // 5. CORÁN ESCRITO – BASMALA SIN NÚMERO Y NUMERACIÓN DESDE 1
    // ============================================================
    function loadSurahList() {
        const select = document.getElementById('surahSelect');
        fetch('https://api.alquran.cloud/v1/surah')
            .then(r => r.json())
            .then(data => {
                if (data.code === 200) {
                    data.data.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.number;
                        opt.textContent = `${s.number}. ${s.englishName} (${s.name})`;
                        select.appendChild(opt);
                    });
                }
            })
            .catch(err => console.error('Error cargando suras:', err));
    }

    function loadQuran(surahNumber, edition) {
        const display = document.getElementById('quranDisplay');
        if (!surahNumber) {
            display.innerHTML = '<p style="text-align:center;color:#b8956a;">Elige una sura para leer.</p>';
            return;
        }
        display.innerHTML = '<p style="text-align:center;color:#d4af37;">Cargando...</p>';

        const arabicUrl = `https://api.alquran.cloud/v1/surah/${surahNumber}`;
        const translationUrl = `https://api.alquran.cloud/v1/surah/${surahNumber}/${edition}`;

        Promise.all([
            fetch(arabicUrl).then(r => r.json()),
            fetch(translationUrl).then(r => r.json())
        ]).then(([arabicData, transData]) => {
            if (arabicData.code === 200 && transData.code === 200) {
                let arabicVerses = arabicData.data.ayahs;
                let transVerses = transData.data.ayahs;

                const suraNum = parseInt(surahNumber);
                const hasBasmala = (suraNum !== 9); // Sura 9 no tiene Basmala

                let html = `<div class="surah-name">${arabicData.data.englishName} - ${arabicData.data.name}</div>`;

                // Si tiene Basmala, la mostramos sin número
                let startIndex = 0;
                if (hasBasmala) {
                    html += `<div class="basmala">${arabicVerses[0].text}</div>`;
                    startIndex = 1; // Empezamos a mostrar desde el verso 2 (índice 1)
                }

                // Mostramos los versículos restantes numerados desde 1
                let verseNumber = 1;
                for (let i = startIndex; i < arabicVerses.length; i++) {
                    const aText = arabicVerses[i].text;
                    const tText = transVerses[i]?.text || '[Traducción no disponible]';
                    html += `<div class="verse">
                                <div class="arabic">
                                    <span class="verse-number">${verseNumber}</span>
                                    ${aText}
                                </div>
                                <div class="translation">
                                    ${tText}
                                </div>
                             </div>`;
                    verseNumber++;
                }

                display.innerHTML = html;
            } else {
                display.innerHTML = `<p style="color:#ff6b6b;">Error al cargar la sura en el idioma seleccionado.</p>`;
            }
        }).catch(err => {
            console.error(err);
            display.innerHTML = '<p style="color:#ff6b6b;">Error de red. Intenta de nuevo.</p>';
        });
    }

    // Eventos para selector de sura e idioma
    document.getElementById('surahSelect').addEventListener('change', function() {
        currentSurah = this.value;
        const lang = document.getElementById('langSelect').value;
        loadQuran(currentSurah, lang);
    });

    document.getElementById('langSelect').addEventListener('change', function() {
        if (currentSurah) {
            loadQuran(currentSurah, this.value);
        }
    });

    // ============================================================
    // 6. BÚSQUEDA POR CIUDAD
    // ============================================================
    document.getElementById('searchBtn').addEventListener('click', function() {
        const city = document.getElementById('cityInput').value.trim();
        if (!city) return;
        fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`)
            .then(r => r.json())
            .then(data => {
                if (data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lng = parseFloat(data[0].lon);
                    userLat = lat; userLng = lng;
                    currentCity = data[0].display_name.split(',')[0];
                    document.getElementById('fechaLocation').innerHTML = `📍 ${currentCity} · ${new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}`;
                    fetchPrayerTimes(lat, lng);
                } else alert('Ciudad no encontrada.');
            })
            .catch(() => alert('Error en la búsqueda.'));
    });

    // ============================================================
    // 7. INICIO
    // ============================================================
    window.onload = function() {
        loadSurahList();
        getUserLocation();
    };
</script>
</body>
</html>
